[project]
name = "workbench"
version = "0.1.0"
description = "Workbench Python workspace"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.2.0",
    "labs",
    "matplotlib>=3.10.9",
    "mplcursors>=0.7.1",
    "nbformat>=5.10.4",
    "numpy>=2.4.4",
    "plotly>=6.7.0",
    "pysr>=1.5.10",
    "tk>=0.1.0",
    "torch>=2.11.0",
]

[tool.uv.workspace]
members = ["packages/labs", "packages/*/*"]
exclude = ["packages/*/runs", "packages/labs/src", "packages/labs/tests"]

[tool.uv.sources]
labs = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
